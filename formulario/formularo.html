<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center">
    <form id="formulario" class="bg-white p-6 rounded shadow w-full max-w-md mt-8">
        <h1 class="text-2xl font-bold mb-6 text-gray-900">Nova propriedade</h1>
        
        <label for="Nome" class="block mb-2 font-semibold text-gray-700">Nome</label>
        <input type="text" id="texto" name="texto" placeholder="Nome" class="w-full mb-4 p-2 border rounded">

        <label for="Data de Nascimento" class="block mb-2 font-semibold text-gray-700">Data de Nascimento</label>
        <input type="text" id="dataNascimento" name="dataNascimento" placeholder="DD/MM/AAAA" maxlength="10" required class="w-full mb-4 p-2 border rounded">

        <label for="Telefone" class="block mb-2 font-semibold text-gray-700">Telefone</label>
        <input type="text" id="Telefone" name="telefone" placeholder="(xx)xxxxx-xxxx" required class="w-full mb-4 p-2 border rounded">

        <label for="cpf" class="block mb-2 font-semibold text-gray-700">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required class="w-full mb-4 p-2 border rounded">

        <label for="Genero" class="block mb-2 font-semibold text-gray-700">Gênero</label>
        <select name="Genero" id="Genero" class="w-full mb-6 p-2 border rounded">
            <option value="">Escolha seu Gênero</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
        </select>

        <h5 class="mb-2 text-gray-800">Itens para listagem separado por ('.'). Ex: 'Um,Dois,Três'</h5>
        <hr class="mb-6">

        <div class="flex gap-2 justify-end">
            <button id="button_Cancel" class="px-4 py-2 rounded bg-gray-300 text-gray-800 hover:bg-gray-400">Cancelar</button>
            <button id="button_Confirm" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Confirmar</button>
        </div>
    </form>

    <h2 class="text-xl font-bold mt-10 text-gray-900">Propriedades Cadastradas</h2>
    <table id="Tabela" class="mt-4 w-full max-w-2xl bg-white rounded shadow">
        <thead>
            <tr class="bg-gray-200 text-gray-700">
                <th class="p-2">Nome</th>
                <th class="p-2">Data Nascimento</th>
                <th class="p-2">Telefone</th>
                <th class="p-2">CPF</th>
                <th class="p-2">Gênero</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="formulario.js"></script>
</body>

</html>
